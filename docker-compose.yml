services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3385:3385"
    volumes:
      # Mount source code for hot reload
      - .:/app
      # Prevent node_modules from being overwritten
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development
    command: npm run dev
    stdin_open: true
    tty: true
